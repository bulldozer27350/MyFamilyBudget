services:
  db:
    image: postgres:16-alpine
    container_name: myfamilybudget-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myfamilybudget}
      POSTGRES_USER: ${POSTGRES_USER:-myfamilybudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myfamilybudget}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myfamilybudget} -d ${POSTGRES_DB:-myfamilybudget}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    # Contrairement a docker-compose.yml (build local depuis les sources),
    # ce fichier recupere l'image deja construite et publiee sur Docker Hub.
    # A adapter dans le .env : DOCKERHUB_IMAGE=tonpseudo/myfamilybudget:latest
    image: ${DOCKERHUB_IMAGE:-moetourneau/myfamilybudget:latest}
    container_name: myfamilybudget-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-myfamilybudget}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myfamilybudget}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-myfamilybudget}
    ports:
      - "${APP_PORT:-8080}:8080"
    labels:
      # Seul ce conteneur porte ce label : watchtower ne surveillera donc que
      # lui, jamais "db" (une mise a jour automatique de Postgres pourrait
      # necessiter une migration manuelle, on ne veut pas que ce soit silencieux).
      - "com.centurylinklabs.watchtower.enable=true"

  # Watchtower interroge Docker Hub a intervalle regulier ; des qu'une nouvelle
  # version de moetourneau/myfamilybudget est publiee (typiquement par la CI
  # GitHub Actions), il la telecharge et redemarre le conteneur "app" avec.
  # Aucune configuration cote GitHub Actions n'est necessaire : c'est le
  # mini-PC qui vient chercher la mise a jour, jamais l'inverse.
  watchtower:
    image: containrrr/watchtower
    container_name: myfamilybudget-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-300}"
      TZ: "${TZ:-Europe/Paris}"

volumes:
  pgdata: