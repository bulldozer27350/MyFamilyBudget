openapi: 3.0.3
info:
  title: API Livre de Comptes (Gestion Budgetaire, Patrimoine & Retraite)
  description: |
    Specification OpenAPI 3.0 pour le back-end Java Spring Boot de l'application Livre de Comptes.
    Permet la migration progressive (Pattern Strangler Fig) depuis la SPA React vers une API REST.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Serveur Spring Boot local
paths:

  # ---------------------------------------------------------------------------
  # VUE D'ENSEMBLE (OVERVIEW)
  # ---------------------------------------------------------------------------
  /overview:
    $ref: './openapi/domains/overview.yaml#/paths/~1overview'

  # ---------------------------------------------------------------------------
  # TRESORERIE (CASHFLOW)
  # ---------------------------------------------------------------------------
  /tresorerie:
    $ref: './openapi/domains/tresorerie.yaml#/paths/~1tresorerie'

  /tresorerie/{listKey}:
    $ref: './openapi/domains/tresorerie.yaml#/paths/~1tresorerie~1{listKey}'

  /tresorerie/{listKey}/{id}:
    $ref: './openapi/domains/tresorerie.yaml#/paths/~1tresorerie~1{listKey}~1{id}'

  /tresorerie/adjust:
    $ref: './openapi/domains/tresorerie.yaml#/paths/~1tresorerie~1adjust'

  # ---------------------------------------------------------------------------
  # PATRIMOINE
  # ---------------------------------------------------------------------------
  /patrimoine:
    $ref: './openapi/domains/patrimoine.yaml#/paths/~1patrimoine'

  /patrimoine/{listKey}:
    $ref: './openapi/domains/patrimoine.yaml#/paths/~1patrimoine~1{listKey}'

  /patrimoine/{listKey}/{id}:
    $ref: './openapi/domains/patrimoine.yaml#/paths/~1patrimoine~1{listKey}~1{id}'

  /patrimoine/placements/{placementId}/historique:
    $ref: './openapi/domains/patrimoine.yaml#/paths/~1patrimoine~1placements~1{placementId}~1historique'

  /patrimoine/placements/{placementId}/historique/{entryId}:
    $ref: './openapi/domains/patrimoine.yaml#/paths/~1patrimoine~1placements~1{placementId}~1historique~1{entryId}'

  /patrimoine/placements/{placementId}/evolution:
    $ref: './openapi/domains/patrimoine.yaml#/paths/~1patrimoine~1placements~1{placementId}~1evolution'

  /retraite:
    $ref: './openapi/domains/retraite.yaml#/paths/~1retraite'

  # ---------------------------------------------------------------------------
  # IMPOTS
  # ---------------------------------------------------------------------------
  /impots:
    $ref: './openapi/domains/fiscalite.yaml#/paths/~1impots'

  # ---------------------------------------------------------------------------
  # PARAMETRES & APPLICATION
  # ---------------------------------------------------------------------------
  /settings:
    get:
      summary: Recupere les parametres globaux (inflation, themes...)
      operationId: getSettings
      tags:
        - Parametres
      responses:
        '200':
          description: Parametres globaux
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Sauvegarde les parametres globaux
      operationId: saveSettings
      tags:
        - Parametres
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Parametres mis à jour

  /budget:
    get:
      summary: Exporte l'integralite du modele de donnees (Sauvegarde)
      operationId: getBudgetFull
      tags:
        - Systeme
      responses:
        '200':
          description: Modele complet JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetDataDto'

  /budget/import:
    post:
      summary: Importe un fichier JSON de sauvegarde complete
      operationId: importJSON
      tags:
        - Systeme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetDataDto'
      responses:
        '200':
          description: Import reussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetDataDto'

  /budget/reset:
    post:
      summary: Reinitialise l'ensemble des donnees
      operationId: resetData
      tags:
        - Systeme
      responses:
        '200':
          description: Reinitialise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetDataDto'

  # ---------------------------------------------------------------------------
  # IMPORT BANCAIRE & RAPPROCHEMENT
  # ---------------------------------------------------------------------------
  /bank-import:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import'

  /bank-import/mapping:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import~1mapping'

  /bank-import/csv:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import~1csv'

  /bank-import/enable-banking/sync:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import~1enable-banking~1sync'

  /bank/convert-excel:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank~1convert-excel'

  /bank/transactions/{txId}/splits:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank~1transactions~1{txId}~1splits'

  /bank-import/{listKey}:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import~1{listKey}'

  /bank-import/{listKey}/{id}:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import~1{listKey}~1{id}'

  /bank-import/transactions/{txId}/category:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import~1transactions~1{txId}~1category'

  /bank-import/rules/recalculate:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import~1rules~1recalculate'

  /bank-import/import:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import~1import'

  /bank-import/transactions/force:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1bank-import~1transactions~1force'

  /pending-operations:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1pending-operations'

  /pending-operations/reconcile:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1pending-operations~1reconcile'

  /pending-operations/ignore:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1pending-operations~1ignore'

  /pending-operations/import-cb:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1pending-operations~1import-cb'

  /pending-operations/merge:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1pending-operations~1merge'

  /pending-operations/force:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1pending-operations~1force'

  /pointage:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1pointage'

  /pointage/matchings/{monthISO}:
    $ref: './openapi/domains/banque-import.yaml#/paths/~1pointage~1matchings~1{monthISO}'

  /analyse:
    $ref: './openapi/domains/analyse.yaml#/paths/~1analyse'

  /analyse/prets:
    $ref: './openapi/domains/analyse.yaml#/paths/~1analyse~1prets'

  /analyse/prets/parametres:
    $ref: './openapi/domains/analyse.yaml#/paths/~1analyse~1prets~1parametres'

  /notifications/parametres:
    $ref: './openapi/domains/objectifs-notifications.yaml#/paths/~1notifications~1parametres'

  /notifications/verifier:
    $ref: './openapi/domains/objectifs-notifications.yaml#/paths/~1notifications~1verifier'

  /notifications/push/cle-publique:
    $ref: './openapi/domains/objectifs-notifications.yaml#/paths/~1notifications~1push~1cle-publique'

  /notifications/push/abonnement:
    $ref: './openapi/domains/objectifs-notifications.yaml#/paths/~1notifications~1push~1abonnement'

  /patrimoine/suggestions-taux:
    $ref: './openapi/domains/patrimoine.yaml#/paths/~1patrimoine~1suggestions-taux'


  # ---------------------------------------------------------------------------
  # TAUX DE MARCHE (aide a la saisie des taux)
  # ---------------------------------------------------------------------------
  /taux-marche:
    $ref: './openapi/domains/patrimoine.yaml#/paths/~1taux-marche'

  /taux-marche/refresh:
    $ref: './openapi/domains/patrimoine.yaml#/paths/~1taux-marche~1refresh'


components:
  schemas:
    BudgetDataDto:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/SettingsDto'
        incomes:
          type: array
          items:
            $ref: '#/components/schemas/IncomeDto'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/ChargeDto'
        placements:
          type: array
          items:
            $ref: '#/components/schemas/PlacementDto'
        realEstate:
          type: array
          items:
            $ref: '#/components/schemas/RealEstateDto'
        retirement:
          $ref: '#/components/schemas/RetirementDto'
        taxChildren:
          type: array
          items:
            $ref: '#/components/schemas/TaxChildDto'
        taxBrackets:
          type: array
          items:
            $ref: '#/components/schemas/TaxBracketDto'
        taxRateOverrides:
          type: array
          items:
            $ref: '#/components/schemas/TaxRateOverrideDto'
        taxActualOverrides:
          type: array
          items:
            $ref: '#/components/schemas/TaxActualOverrideDto'
        oneoff:
          type: array
          items:
            $ref: '#/components/schemas/OneOffExpenseDto'
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/TransferDto'
        variableIncomes:
          type: array
          items:
            $ref: '#/components/schemas/VariableIncomeDto'
        variableOverrides:
          type: array
          items:
            $ref: '#/components/schemas/VariableOverrideDto'
        bankImport:
          $ref: '#/components/schemas/BankImportDto'
        assetCategories:
          type: array
          items:
            $ref: '#/components/schemas/AssetCategoryDto'
        loans:
          type: array
          items:
            $ref: '#/components/schemas/LoanDto'
        objectifs:
          type: array
          items:
            $ref: '#/components/schemas/ObjectifDto'

    SettingsDto:
      type: object
      properties:
        birthYear:
          type: integer
        retireAge:
          type: integer
        simulateUntilAge:
          type: integer
        inflationRate:
          type: number
        pivotDate:
          type: string
        pivotMode:
          type: string
        startBalance:
          type: number
        childExitAge:
          type: integer
        taxAbattement:
          type: number
        pass2026:
          type: number
        passGrowthRate:
          type: number
        sweepEnabled:
          type: boolean
        cashCeiling:
          type: number
        cashFloor:
          type: number
        cashAlertThreshold:
          type: number
        goalSecureHorizonMonths:
          type: integer
        goalLiquidHorizonMonths:
          type: integer

    IncomeDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        monthly:
          type: number
        start:
          type: string
        end:
          type: string
        growthRate:
          type: number
        categoryId:
          type: string
        notes:
          type: string

    ChargeDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        monthly:
          type: number
        start:
          type: string
        end:
          type: string
        growthRate:
          type: number
        categoryId:
          type: string
        notes:
          type: string

    PlacementDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        category:
          type: string
        balance:
          type: number
        balanceDate:
          type: string
        monthly:
          type: number
        monthlyFrom:
          type: string
        monthlyUntil:
          type: string
        ratePess:
          type: number
        rateCorr:
          type: number
        rateOpti:
          type: number
        excludedFromRetirement:
          type: boolean
        notes:
          type: string
        sweepPriority:
          type: integer
        sweepCap:
          type: number
        pauseTriggerBalance:
          type: number
        pausePriority:
          type: integer
        categoryId:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/PlacementHistoryEntryDto'

    PlacementHistoryEntryDto:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        value:
          type: number
        notes:
          type: string

    LoanDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        crd:
          type: number
        rate:
          type: number
        monthly:
          type: number
        insurance:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        initialAmount:
          type: number
        totalInstallments:
          type: integer
        stepDate:
          type: string

    RealEstateDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        currentValue:
          type: number
        valuationYear:
          type: integer
        annualGrowthRate:
          type: number
        notes:
          type: string

    RetirementDto:
      type: object
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/RetirementPersonDto'
        pass2026:
          type: number
        passGrowthRate:
          type: number
        agircPointValue:
          type: number
        agircPointDateGlobal:
          type: string
        agircPointGrowthRate:
          type: number

    RetirementPersonDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        birthYear:
          type: integer
        incomeLabel:
          type: string
        cadre:
          type: boolean
        trimestresValides:
          type: integer
        trimestresDate:
          type: string
        salaryHistory:
          type: array
          items:
            $ref: '#/components/schemas/SalaryHistoryDto'
        agircPoints:
          type: number
        ratioPointsParEuro:
          type: number

    SalaryHistoryDto:
      type: object
      properties:
        year:
          type: integer
        salary:
          type: number

    TaxChildDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        birthYear:
          type: integer

    TaxBracketDto:
      type: object
      properties:
        id:
          type: string
        upTo:
          type: number
        rate:
          type: number

    TaxRateOverrideDto:
      type: object
      properties:
        year:
          type: integer
        rate:
          type: number

    TaxActualOverrideDto:
      type: object
      properties:
        year:
          type: integer
        amount:
          type: number

    OneOffExpenseDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        date:
          type: string
        amount:
          type: number
        notes:
          type: string

    TransferDto:
      type: object
      properties:
        id:
          type: string
        placement:
          type: string
        date:
          type: string
        amount:
          type: number
        notes:
          type: string

    ObjectifDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        targetAmount:
          type: number
        allocatedAmount:
          type: number
          deprecated: true
          description: >-
            Champ historique (objectifs mono-compte). Remplacé par `allocations` ;
            conservé uniquement pour la bascule en lecture des objectifs enregistrés
            avant l'introduction du multi-comptes.
        targetDate:
          type: string
        sourcePlacementId:
          type: string
          deprecated: true
          description: >-
            Champ historique (objectifs mono-compte). Remplacé par `allocations` ;
            conservé uniquement pour la bascule en lecture des objectifs enregistrés
            avant l'introduction du multi-comptes.
        notes:
          type: string
        allocations:
          type: array
          description: >-
            Comptes (vue Patrimoine) alimentant cet objectif, chacun avec le montant
            qui lui est réservé. Un même compte peut apparaître dans plusieurs
            objectifs différents ; la somme de ses allocations, tous objectifs
            confondus, ne peut pas dépasser son solde.
          items:
            $ref: '#/components/schemas/ObjectifAllocationDto'

    ObjectifAllocationDto:
      type: object
      properties:
        id:
          type: string
        placementId:
          type: string
        amount:
          type: number

    VariableIncomeDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        refIncomeLabel:
          type: string
        rate:
          type: number
        startYear:
          type: integer
        endYear:
          type: integer
        taxable:
          type: string
        type:
          type: string
        notes:
          type: string

    VariableOverrideDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        year:
          type: integer
        amount:
          type: number
        taxable:
          type: string
        notes:
          type: string

    BankTransactionSplitDto:
      type: object
      properties:
        id:
          type: string
        categoryId:
          type: string
        budgetLineId:
          type: string
        amount:
          type: number
        label:
          type: string

    BankTransactionDto:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        label:
          type: string
        amount:
          type: number
        categoryId:
          type: string
        type:
          type: string
        splits:
          type: array
          items:
            $ref: '#/components/schemas/BankTransactionSplitDto'

    BankImportDto:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/BankTransactionDto'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BankImportCategoryDto'
        matchings:
          type: array
          items:
            $ref: '#/components/schemas/BankImportMatchingDto'
        pendingOperations:
          type: array
          items:
            $ref: '#/components/schemas/PendingOperationDto'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/BankImportRuleDto'
        columnMapping:
          $ref: '#/components/schemas/BankColumnMappingDto'

    PendingOperationDto:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        expectedDate:
          type: string
        type:
          type: string
        refNumber:
          type: string
        label:
          type: string
        amount:
          type: number
        categoryId:
          type: string
        status:
          type: string
        linkedTxId:
          type: string
        clearedDate:
          type: string
        notes:
          type: string
        budgetLineId:
          type: string
        splits:
          type: array
          items:
            $ref: '#/components/schemas/BankTransactionSplitDto'

    BankImportRuleDto:
      type: object
      properties:
        id:
          type: string
        matchText:
          type: string
        categoryId:
          type: string

    BankColumnMappingDto:
      type: object
      properties:
        delimiter:
          type: string
        dateFormat:
          type: string
        hasHeader:
          type: boolean
        dateCol:
          type: integer
        labelCol:
          type: integer
        typeCol:
          type: integer
        amountCol:
          type: integer

    BankImportCategoryDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [Revenu, Dépense, "Les deux"]
        compressible:
          type: string
          enum: [Oui, Non]

    BankImportMatchingDto:
      type: object
      properties:
        month:
          type: string
          description: Mois au format ISO (YYYY-MM)
        links:
          type: array
          items:
            $ref: '#/components/schemas/BankImportMatchingLinkDto'

    BankImportMatchingLinkDto:
      type: object
      properties:
        budgetLineId:
          type: string
        txIds:
          type: array
          items:
            type: string

    CashflowYearDto:
      type: object
      properties:
        year:
          type: integer
        income:
          type: number
        variableIncome:
          type: number
        savings:
          type: number
        charges:
          type: number
        oneoff:
          type: number
        transfersY:
          type: number
        impots:
          type: number
        regularisation:
          type: number
        net:
          type: number
        balance:
          type: number

    PatrimoineYearDto:
      type: object
      properties:
        year:
          type: integer
        pess:
          type: number
        corr:
          type: number
        opti:
          type: number

    PatrimoinePerPlacementDto:
      type: object
      properties:
        label:
          type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PatrimoineYearDto'

    PatrimoineProjectionsDto:
      type: object
      properties:
        perPlacement:
          type: array
          items:
            $ref: '#/components/schemas/PatrimoinePerPlacementDto'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/PatrimoineYearDto'


    AssetCategoryDto:
      type: object
      properties:
        id:
          type: string
        icon:
          type: string
        name:
          type: string
        bucket:
          type: string
        color:
          type: string
