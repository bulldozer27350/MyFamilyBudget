openapi: 3.0.3
info:
  title: API Livre de Comptes (Gestion Budgetaire, Patrimoine & Retraite)
  description: |
    Specification OpenAPI 3.0 pour le back-end Java Spring Boot de l'application Livre de Comptes.
    Permet la migration progressive (Pattern Strangler Fig) depuis la SPA React vers une API REST.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Serveur Spring Boot local
paths:

  # ---------------------------------------------------------------------------
  # VUE D'ENSEMBLE (OVERVIEW)
  # ---------------------------------------------------------------------------
  /overview:
    get:
      summary: Recupere la vue d'ensemble (KPIs, projections, jauges FIRE)
      operationId: getOverview
      tags:
        - Overview
      parameters:
        - name: useConstantEuros
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Donnees synthetiques de la vue d'ensemble
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponseDto'

  # ---------------------------------------------------------------------------
  # TRESORERIE (CASHFLOW)
  # ---------------------------------------------------------------------------
  /tresorerie:
    get:
      summary: Recupere les donnees de tresorerie (revenus, charges, depenses, primes)
      operationId: getTresorerie
      tags:
        - Tresorerie
      parameters:
        - name: useConstantEuros
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Donnees de tresorerie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TresorerieResponseDto'

  /tresorerie/{listKey}:
    post:
      summary: Ajoute une nouvelle ligne dans une section de tresorerie
      operationId: addTresorerieLigne
      tags:
        - Tresorerie
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
            enum: [incomes, charges, oneoff, variableIncomes, variableOverrides]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Ligne ajoutee avec succes
          content:
            application/json:
              schema:
                type: object

  /tresorerie/{listKey}/{id}:
    put:
      summary: Met à jour une ligne de tresorerie
      operationId: updateTresorerieLigne
      tags:
        - Tresorerie
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
            enum: [incomes, charges, oneoff, variableIncomes, variableOverrides, placements]
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTresorerieLigneRequestDto'
      responses:
        '200':
          description: Ligne mise à jour
    delete:
      summary: Supprime une ligne de tresorerie
      operationId: removeTresorerieLigne
      tags:
        - Tresorerie
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Ligne supprimee

  /tresorerie/adjust:
    post:
      summary: Applique une suggestion d'ajustement budgetaire
      operationId: applyTresorerieAjustement
      tags:
        - Tresorerie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TresorerieAjustementRequestDto'
      responses:
        '200':
          description: Ajustement applique

  # ---------------------------------------------------------------------------
  # PATRIMOINE
  # ---------------------------------------------------------------------------
  /patrimoine:
    get:
      summary: Recupere les donnees de patrimoine (placements, credits, immo)
      operationId: getPatrimoine
      tags:
        - Patrimoine
      parameters:
        - name: useConstantEuros
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Donnees de patrimoine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatrimoineResponseDto'

  /patrimoine/{listKey}:
    post:
      summary: Sauvegarde/Cree une ligne de patrimoine
      operationId: savePatrimoineLigne
      tags:
        - Patrimoine
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
            enum: [placements, transfers, credits, loans, realEstate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Ligne enregistree

  /patrimoine/{listKey}/{id}:
    delete:
      summary: Supprime une ligne de patrimoine
      operationId: deletePatrimoineLigne
      tags:
        - Patrimoine
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Supprime

  /patrimoine/placements/{placementId}/historique:
    post:
      summary: Ajoute un point d'historique de valeur pour un placement
      operationId: addPlacementHistoriquePoint
      tags:
        - Patrimoine
      parameters:
        - name: placementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, value]
              properties:
                date:
                  type: string
                  format: date
                value:
                  type: number
      responses:
        '200':
          description: Point ajoute

  /patrimoine/placements/{placementId}/historique/{index}:
    delete:
      summary: Supprime un point d'historique de valeur
      operationId: deletePlacementHistoriquePoint
      tags:
        - Patrimoine
      parameters:
        - name: placementId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Point supprime

  # ---------------------------------------------------------------------------
  # RETRAITE
  # ---------------------------------------------------------------------------
  /retraite:
    get:
      summary: Recupere la simulation et la configuration retraite
      operationId: getRetraite
      tags:
        - Retraite
      responses:
        '200':
          description: Configuration et resultats de retraite
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Sauvegarde la configuration retraite
      operationId: saveRetraite
      tags:
        - Retraite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Configuration enregistree

  # ---------------------------------------------------------------------------
  # IMPOTS
  # ---------------------------------------------------------------------------
  /impots:
    get:
      summary: Recupere le simulateur d'impots sur le revenu
      operationId: getImpots
      tags:
        - Impots
      responses:
        '200':
          description: Donnees du simulateur d'impots
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Sauvegarde la configuration d'impots
      operationId: saveImpotsConfig
      tags:
        - Impots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Enregistre

  # ---------------------------------------------------------------------------
  # PARAMETRES & APPLICATION
  # ---------------------------------------------------------------------------
  /settings:
    get:
      summary: Recupere les parametres globaux (inflation, themes...)
      operationId: getSettings
      tags:
        - Parametres
      responses:
        '200':
          description: Parametres globaux
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Sauvegarde les parametres globaux
      operationId: saveSettings
      tags:
        - Parametres
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Parametres mis à jour

  /budget:
    get:
      summary: Exporte l'integralite du modele de donnees (Sauvegarde)
      operationId: getBudgetFull
      tags:
        - Systeme
      responses:
        '200':
          description: Modele complet JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetDataDto'

  /budget/import:
    post:
      summary: Importe un fichier JSON de sauvegarde complete
      operationId: importJSON
      tags:
        - Systeme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetDataDto'
      responses:
        '200':
          description: Import reussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetDataDto'

  /budget/reset:
    post:
      summary: Reinitialise l'ensemble des donnees
      operationId: resetData
      tags:
        - Systeme
      responses:
        '200':
          description: Reinitialise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetDataDto'

  # ---------------------------------------------------------------------------
  # IMPORT BANCAIRE & RAPPROCHEMENT
  # ---------------------------------------------------------------------------
  /bank-import:
    get:
      summary: Recupere l'etat de l'import bancaire (CSV, regles, transactions)
      operationId: getBankImport
      tags:
        - Import Bancaire
      responses:
        '200':
          description: Donnees d'import bancaire
          content:
            application/json:
              schema:
                type: object

  /bank-import/mapping:
    put:
      summary: Met à jour la correspondance des colonnes CSV
      operationId: updateBankImportMapping
      tags:
        - Import Bancaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Mapping mis à jour

  /bank-import/csv:
    post:
      summary: Receptionne et traite un fichier CSV bancaire
      operationId: importBankCSV
      tags:
        - Import Bancaire
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Traitement du CSV effectue

  /bank/convert-excel:
    post:
      summary: Convertit un fichier Excel (.xls ou .xlsx) en texte CSV
      operationId: convertExcelToCsv
      tags:
        - Import Bancaire
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Fichier Excel (.xls ou .xlsx) à convertir
      responses:
        '200':
          description: Contenu CSV résultant de la conversion
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Format de fichier non supporté ou nombre de lignes dépassé
          content:
            text/plain:
              schema:
                type: string

  /bank/transactions/{txId}/splits:
    put:
      summary: Met à jour la ventilation (splits) d'une transaction bancaire
      operationId: updateBankTransactionSplits
      tags:
        - Import Bancaire
      parameters:
        - name: txId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BankTransactionSplitDto'
      responses:
        '200':
          description: Ventilation mise à jour avec succès
        '400':
          description: Somme des splits non valide
        '404':
          description: Transaction non trouvée

  /bank-import/{listKey}:
    post:
      summary: Ajoute une entree dans une section d'import bancaire (categorie ou regle)
      operationId: addBankImportLigne
      tags:
        - Import Bancaire
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
            enum: [categories, rules]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Entree ajoutee avec succes
          content:
            application/json:
              schema:
                type: object

  /bank-import/{listKey}/{id}:
    put:
      summary: Met a jour un champ d'une entree d'import bancaire
      operationId: updateBankImportLigne
      tags:
        - Import Bancaire
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
            enum: [categories, rules]
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBankImportLigneRequestDto'
      responses:
        '200':
          description: Entree mise a jour
        '404':
          description: Entree non trouvee
    delete:
      summary: Supprime une entree d'import bancaire
      operationId: removeBankImportLigne
      tags:
        - Import Bancaire
      parameters:
        - name: listKey
          in: path
          required: true
          schema:
            type: string
            enum: [categories, rules]
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Entree supprimee

  /bank-import/transactions/{txId}/category:
    put:
      summary: Met a jour la categorie d'une transaction et cree optionnellement une regle
      operationId: setBankImportTransactionCategory
      tags:
        - Import Bancaire
      parameters:
        - name: txId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBankTransactionCategoryRequestDto'
      responses:
        '200':
          description: Categorie de transaction mise a jour

  /bank-import/rules/recalculate:
    post:
      summary: Reapplique les regles aux transactions non categorisees
      operationId: recalculateBankImportRules
      tags:
        - Import Bancaire
      responses:
        '200':
          description: Regles reappliquees

  /bank-import/import:
    post:
      summary: Importe des transactions bancaires a partir de lignes CSV pre-parsees et roles de colonnes
      operationId: importBankTransactions
      tags:
        - Import Bancaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBankTransactionsRequestDto'
      responses:
        '200':
          description: Resume de l'import bancaire
          content:
            application/json:
              schema:
                type: object

  /bank-import/transactions/force:
    post:
      summary: Force l'import d'une transaction marquee comme doublon
      operationId: forceImportBankTransaction
      tags:
        - Import Bancaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Transaction importee avec succes
          content:
            application/json:
              schema:
                type: object

  # ---------------------------------------------------------------------------
  # OPERATIONS EN COURS (PENDING)
  # ---------------------------------------------------------------------------
  /pending-operations:
    get:
      summary: Recupere les operations en cours à rapprocher
      operationId: getPendingOperations
      tags:
        - Operations en cours
      responses:
        '200':
          description: Liste des operations en cours
          content:
            application/json:
              schema:
                type: object

  /pending-operations/reconcile:
    post:
      summary: Effectue le rapprochement automatique des operations en cours avec le releve bancaire
      operationId: reconcilePendingOperations
      tags:
        - Operations en cours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: >
            Resultat du rapprochement automatique. Les paires dont la categorisation differe entre
            l'operation en attente et la transaction bancaire (categoryId ou splits) ne sont PAS
            rapprochees automatiquement et sont comptabilisees dans needsReviewCount ; elles doivent
            etre traitees manuellement, ou l'operateur sera invite a arbitrer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matchCount:
                    type: integer
                    description: Nombre d'operations en attente effectivement rapprochees.
                  needsReviewCount:
                    type: integer
                    description: >
                      Nombre de paires candidates trouvees mais non rapprochees automatiquement car
                      les categorisations different entre l'operation en attente et la transaction.

  /pending-operations/ignore:
    post:
      summary: Ignore une operation en cours
      operationId: ignorePendingOperation
      tags:
        - Operations en cours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Ignoree

  /pending-operations/import-cb:
    post:
      summary: Importe des operations CB differees depuis un releve CSV
      operationId: importPendingCB
      tags:
        - Operations en cours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Resume de l'import des operations CB
          content:
            application/json:
              schema:
                type: object

  /pending-operations/merge:
    post:
      summary: Fusionne une operation manuelle avec une operation du releve
      operationId: mergePendingOperation
      tags:
        - Operations en cours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Operation fusionnee

  /pending-operations/force:
    post:
      summary: Force l'import d'une operation ignoree ou candidate
      operationId: forceImportPendingOperation
      tags:
        - Operations en cours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Operation importee de force

  # ---------------------------------------------------------------------------
  # POINTAGE (MATCHING)
  # ---------------------------------------------------------------------------
  /pointage:
    get:
      summary: Recupere l'etat des liaisons du pointage mensuel
      operationId: getPointage
      tags:
        - Pointage
      responses:
        '200':
          description: Donnees de pointage
          content:
            application/json:
              schema:
                type: object

  /pointage/matchings/{monthISO}:
    put:
      summary: Enregistre le pointage d'un mois specifique
      operationId: savePointageMatching
      tags:
        - Pointage
      parameters:
        - name: monthISO
          in: path
          required: true
          schema:
            type: string
            example: "2026-05"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Pointage mis à jour

  # ---------------------------------------------------------------------------
  # ANALYSE
  # ---------------------------------------------------------------------------
  /analyse:
    get:
      summary: Recupere le comparatif Reel vs Previsionnel et derives
      operationId: getAnalyse
      tags:
        - Analyse
      parameters:
        - name: monthsBack
          in: query
          required: false
          schema:
            type: integer
            default: 12
            description: Nombre de mois à analyser (3, 6, 12, 0 pour toute la période)
      responses:
        '200':
          description: Donnees d'analyse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyseResponseDto'

components:
  schemas:
    OverviewResponseDto:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BudgetDataDto'
        years:
          type: array
          items:
            type: integer
        cashflow:
          type: array
          items:
            $ref: '#/components/schemas/CashflowYearDto'
        patrimoine:
          $ref: '#/components/schemas/PatrimoineProjectionsDto'
        useConstantEuros:
          type: boolean
        retireYear:
          type: integer
        pivotBalance:
          type: number
        patrimoineActuel:
          type: number
        fluxNetActuel:
          type: number
        retireCharges:
          type: number
        totalPensions:
          type: number
        retirePatrimoine:
          $ref: '#/components/schemas/TripleAmountDto'
        fireRente:
          $ref: '#/components/schemas/TripleAmountDto'
        financialOnlyRente:
          $ref: '#/components/schemas/TripleAmountDto'

    BudgetDataDto:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/SettingsDto'
        incomes:
          type: array
          items:
            $ref: '#/components/schemas/IncomeDto'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/ChargeDto'
        placements:
          type: array
          items:
            $ref: '#/components/schemas/PlacementDto'
        realEstate:
          type: array
          items:
            $ref: '#/components/schemas/RealEstateDto'
        retirement:
          $ref: '#/components/schemas/RetirementDto'
        taxChildren:
          type: array
          items:
            $ref: '#/components/schemas/TaxChildDto'
        taxBrackets:
          type: array
          items:
            $ref: '#/components/schemas/TaxBracketDto'
        taxRateOverrides:
          type: array
          items:
            $ref: '#/components/schemas/TaxRateOverrideDto'
        taxActualOverrides:
          type: array
          items:
            $ref: '#/components/schemas/TaxActualOverrideDto'
        oneoff:
          type: array
          items:
            $ref: '#/components/schemas/OneOffExpenseDto'
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/TransferDto'
        variableIncomes:
          type: array
          items:
            $ref: '#/components/schemas/VariableIncomeDto'
        variableOverrides:
          type: array
          items:
            $ref: '#/components/schemas/VariableOverrideDto'
        bankImport:
          $ref: '#/components/schemas/BankImportDto'
        assetCategories:
          type: array
          items:
            $ref: '#/components/schemas/AssetCategoryDto'
        loans:
          type: array
          items:
            $ref: '#/components/schemas/LoanDto'

    SettingsDto:
      type: object
      properties:
        birthYear:
          type: integer
        retireAge:
          type: integer
        simulateUntilAge:
          type: integer
        inflationRate:
          type: number
        pivotDate:
          type: string
        pivotMode:
          type: string
        startBalance:
          type: number
        childExitAge:
          type: integer
        taxAbattement:
          type: number
        pass2026:
          type: number
        passGrowthRate:
          type: number
        sweepEnabled:
          type: boolean
        cashCeiling:
          type: number
        cashFloor:
          type: number

    IncomeDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        monthly:
          type: number
        start:
          type: string
        end:
          type: string
        growthRate:
          type: number
        categoryId:
          type: string
        notes:
          type: string

    ChargeDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        monthly:
          type: number
        start:
          type: string
        end:
          type: string
        growthRate:
          type: number
        categoryId:
          type: string
        notes:
          type: string

    PlacementDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        category:
          type: string
        balance:
          type: number
        balanceDate:
          type: string
        monthly:
          type: number
        monthlyFrom:
          type: string
        monthlyUntil:
          type: string
        ratePess:
          type: number
        rateCorr:
          type: number
        rateOpti:
          type: number
        excludedFromRetirement:
          type: boolean
        notes:
          type: string
        sweepPriority:
          type: integer
        sweepCap:
          type: number
        pauseTriggerBalance:
          type: number
        pausePriority:
          type: integer
        categoryId:
          type: string

    LoanDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        crd:
          type: number
        rate:
          type: number
        monthly:
          type: number
        insurance:
