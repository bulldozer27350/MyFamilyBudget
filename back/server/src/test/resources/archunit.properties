#
# Configuration ArchUnit (RF-001, voir doc/architecture/00-principes.md et 01-sequencement.md).
#
# freeze.store.default.path : les violations gelées sont stockées dans ce dossier, relatif au
# répertoire de travail de Maven (back/server), donc à committer avec le code au fur et à mesure
# qu'il évolue — ce n'est pas un dossier de build à ignorer.
#
# freeze.store.default.allowStoreCreation=true : au tout premier lancement (dossier absent), le
# store est créé et gèle automatiquement les violations constatées à cet instant. C'est le
# bootstrap attendu par RF-001 : « geler les violations actuelles sans les corriger ». Une fois
# le dossier créé et son contenu committé, ce réglage n'a plus d'effet (le store existe déjà).
#
# freeze.store.default.allowStoreUpdate=true : autorise le store à se réduire lui-même quand une
# violation gelée disparaît (domaine migré) — c'est le mécanisme par lequel chaque patch de
# garde-fou de domaine (RF-103, RF-203, RF-302, RF-402, RF-502, RF-602, RF-703, RF-803, RF-902)
# fait reculer la liste gelée, comme demandé par 15-backlog-patchs.md. Une violation gelée ne
# doit en revanche jamais être ajoutée manuellement : seule une exécution de test le fait.
#
# freeze.refreeze=false : ne jamais réinitialiser en masse le store sur l'état courant (ce serait
# accepter silencieusement toute nouvelle violation introduite depuis le dernier gel).
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
freeze.refreeze=false
