server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  main:
    headless: true
  application:
    name: server-test
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  # R-01 (24-backlog-reste-a-faire.md) : les tests continuent d'utiliser ddl-auto (H2 en memoire,
  # recree a chaque run) ; Liquibase reste desactive ici, y compris apres le lot B.
  liquibase:
    enabled: false

myfamilybudget:
  browser:
    auto-open: false
  market-data:
    enabled: false
