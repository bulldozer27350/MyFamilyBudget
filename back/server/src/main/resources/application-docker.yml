# Profil "docker" : à activer explicitement avec SPRING_PROFILES_ACTIVE=docker
# Ce profil ne remplace pas le profil par défaut (H2, distribution portable) :
# il vient uniquement le surcharger pour un déploiement conteneurisé avec PostgreSQL.

server:
  servlet:
    # Exposé en prod sous /myfamilybudget (accès via Tailscale : http://server/myfamilybudget),
    # au lieu du /api/v1 utilisé en développement local (profil par défaut, inchangé).
    context-path: /myfamilybudget

spring:
  main:
    headless: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myfamilybudget}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:myfamilybudget}
    password: ${SPRING_DATASOURCE_PASSWORD:myfamilybudget}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # R-01, correctif CI : dialecte maison (pas org.hibernate.dialect.PostgreSQLDialect standard),
        # voir Javadoc de TextClobPostgreSQLDialect (module infra-jpa) pour le pourquoi (CLOB -> text,
        # pas oid).
        dialect: com.moe.myfamilybudget.infra.jpa.TextClobPostgreSQLDialect
  # R-01 (24-backlog-reste-a-faire.md), lot B : Liquibase bascule actif, ddl-auto en validate.
  # ATTENTION DEPLOIEMENT (DA-16 de 23-registre-decisions-actives.md) : la base PostgreSQL de prod
  # doit etre videe (reset propre : export JSON, DROP, reimport via /budget/import) AVANT de
  # redemarrer l'appli avec cette image. Sur une base non videe, Liquibase refuse de demarrer (tables
  # deja existantes hors de son suivi) : echec attendu, pas un bug, c'est le garde-fou.
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  h2:
    console:
      enabled: false
