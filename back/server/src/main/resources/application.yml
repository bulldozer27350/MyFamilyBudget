server:
  port: 8080
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  main:
    headless: false
  application:
    name: server
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/myfamilybudget;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.moe.myfamilybudget: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

myfamilybudget:
  # Aide à la saisie des taux : données publiques utilisées comme suggestions (jamais appliquées
  # automatiquement). Le dernier instantané réussi est persisté en base.
  market-data:
    enabled: true            # false : aucune interrogation automatique des sources
    timeout-seconds: 5       # délai de connexion et de lecture par appel
    refresh:
      initial-delay: PT30S   # premier rafraîchissement après le démarrage (durée ISO-8601)
      interval: PT12H        # délai entre deux rafraîchissements
    cdc:
      base-url: https://opendata.caissedesdepots.fr/api/explore/v2.1
      dataset: flux-et-taux-la-ldds-lep
    ecb:
      base-url: https://data-api.ecb.europa.eu          # courbe des taux zone euro (sans clé)
    bdf:
      base-url: https://webstat.banque-france.fr/api/explore/v2.1
      # Clé d'API Webstat (gratuite) : sans elle, la source est ignorée sans erreur et le taux de
      # marché des crédits est à saisir à la main. À fournir par variable d'environnement.
      api-key: ${MYFAMILYBUDGET_BDF_API_KEY:}
      mortgage-series-key: MIR1.M.FR.B.A22HR.A.5.A.2254U6.EUR.N   # nouveaux crédits à l'habitat, hors renégociations

  # Synchronisation bancaire automatique via Enable Banking (DSP2). Le certificat n'est jamais
  # embarqué dans l'image ni dans le dépôt : seul son chemin sur l'hôte est fourni (voir
  # docker-compose.prod.yml). Sans application-id, sans certificat lisible à ce chemin, ou sans
  # compte déclaré, la synchronisation est simplement désactivée (log au démarrage) : l'appli
  # démarre et fonctionne normalement sans elle. C'est le comportement par défaut de la
  # distribution portable (MyFamilyBudget.bat), qui ne fournit jamais ces variables.
  enable-banking:
    scheduler-enabled: true   # false : aucune synchronisation planifiée (le bouton front reste actif)
    timeout-seconds: 15
    application-id: ${MYFAMILYBUDGET_ENABLE_BANKING_APPLICATION_ID:}
    private-key-path: ${MYFAMILYBUDGET_ENABLE_BANKING_PRIVATE_KEY_PATH:}
    # Format : "libellé 1|uid-1;libellé 2|uid-2;..." (voir EnableBankingAccounts)
    accounts: ${MYFAMILYBUDGET_ENABLE_BANKING_ACCOUNTS:}
    api-base-url: https://api.enablebanking.com
    refresh:
      initial-delay: PT1M    # premier essai après le démarrage (durée ISO-8601)
      interval: PT6H         # délai entre deux synchronisations planifiées
