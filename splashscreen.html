<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyFamilyBudget - Démarrage</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232F5D50'><path d='M12 2L2 9.5V20C2 21.1 2.9 22 4 22H20C21.1 22 22 21.1 22 20V9.5L12 2ZM12 4.3L19 9.6V20H5V9.6L12 4.3ZM11 12H13V14H15V16H13V18H11V16H9V14H11V12Z'/></svg>">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.4s ease-out;
    }

    .splash-container {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .glow-aura {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(47, 93, 80, 0.5) 0%, rgba(74, 222, 128, 0.15) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(28px);
      pointer-events: none;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    .logo-box {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #4ade80;
      border-right-color: rgba(47, 93, 80, 0.6);
      animation: spinRing 4s linear infinite;
    }

    .logo-ring-reverse {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px dashed rgba(74, 222, 128, 0.25);
      animation: spinRingRev 10s linear infinite;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinRingRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #2F5D50 0%, #173830 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(74, 222, 128, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: badgeFloat 3s ease-in-out infinite alternate;
    }

    @keyframes badgeFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    .logo-svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-growth-line {
      stroke: #4ade80;
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawLine 2s cubic-bezier(0.4, 0, 0.2, 1) forwards infinite;
    }

    @keyframes drawLine {
      0% { stroke-dashoffset: 40; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }

    .app-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    .app-subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 400;
      margin-bottom: 32px;
      letter-spacing: 0.2px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    .progress-bar-scan {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35%;
      background: linear-gradient(90deg, transparent 0%, #4ade80 50%, #2F5D50 100%);
      border-radius: 999px;
      animation: scanLaser 1.5s ease-in-out infinite;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0%;
      background: linear-gradient(90deg, #2F5D50, #4ade80);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    @keyframes scanLaser {
      0% { left: -35%; }
      100% { left: 100%; }
    }

    .status-text {
      font-size: 13px;
      color: #cbd5e1;
      min-height: 20px;
      margin-bottom: 24px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .status-text.connected {
      color: #4ade80;
      font-weight: 600;
    }

    .direct-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.6);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .direct-link:hover {
      color: #f1f5f9;
      background: rgba(51, 65, 85, 0.8);
      border-color: #4ade80;
    }

    .footer-badge {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      color: #475569;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body id="body">

  <div class="glow-aura"></div>

  <main class="splash-container" id="splash-main">
    <div class="logo-box">
      <div class="logo-ring-reverse"></div>
      <div class="logo-ring"></div>
      <div class="logo-badge">
        <svg class="logo-svg" viewBox="0 0 24 24">
          <path d="M12 2L4 5.5V11.5C4 16.5 7.4 21.1 12 22.3C16.6 21.1 20 16.5 20 11.5V5.5L12 2Z" fill="rgba(255,255,255,0.08)" stroke="#ffffff"/>
          <path class="logo-growth-line" d="M7 14L10.5 11L13 13.5L17 9.5"/>
          <circle cx="17" cy="9.5" r="1.5" fill="#4ade80" stroke="#ffffff" stroke-width="0.8"/>
        </svg>
      </div>
    </div>

    <h1 class="app-title">MyFamilyBudget</h1>
    <p class="app-subtitle">Livre de comptes &amp; Gestion patrimoniale</p>

    <div class="progress-track" id="progress-track">
      <div class="progress-bar-scan" id="progress-scan"></div>
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>

    <div class="status-text" id="status-text">Démarrage du serveur Spring Boot en cours…</div>

    <a href="http://localhost:8080/api/v1/overview.html" class="direct-link" id="direct-btn">
      <span>Accéder directement à l'application</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </main>

  <footer class="footer-badge">MyFamilyBudget • Démarrage autonome</footer>

  <script>
    (function () {
      const SERVER_APP_URL = "http://localhost:8080/api/v1/overview.html";
      const PING_URL = "http://localhost:8080/api/v1/heartbeat";

      const statusEl = document.getElementById("status-text");
      const scanEl = document.getElementById("progress-scan");
      const fillEl = document.getElementById("progress-fill");

      let attempts = 0;
      let hasNavigated = false;
      const startTime = Date.now();
      const MIN_DISPLAY_MS = 1200; // Présentation minimale du splashscreen pour le confort visuel

      function navigateToApp() {
        if (hasNavigated) return;
        hasNavigated = true;

        if (statusEl) {
          statusEl.textContent = "✓ Serveur opérationnel ! Ouverture…";
          statusEl.classList.add("connected");
        }
        if (scanEl) scanEl.style.display = "none";
        if (fillEl) fillEl.style.width = "100%";

        const elapsed = Date.now() - startTime;
        const waitTime = Math.max(250, MIN_DISPLAY_MS - elapsed);

        setTimeout(function () {
          document.body.style.opacity = "0";
          setTimeout(function () {
            window.location.replace(SERVER_APP_URL);
          }, 300);
        }, waitTime);
      }

      async function pingServer() {
        if (hasNavigated) return;
        attempts++;

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 800);

          const res = await fetch(PING_URL, {
            method: "GET",
            headers: { "Accept": "application/json, text/plain, */*" },
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.ok || res.status < 500) {
            navigateToApp();
            return;
          }
        } catch (err) {
          // Serveur pas encore prêt
        }

        // Messages progressifs d'accompagnement
        if (attempts === 3 && statusEl) {
          statusEl.textContent = "Initialisation du moteur financier Spring Boot…";
        } else if (attempts === 8 && statusEl) {
          statusEl.textContent = "Chargement des modules patrimoniaux & base de données…";
        } else if (attempts === 15 && statusEl) {
          statusEl.textContent = "Finalisation du démarrage…";
        }

        setTimeout(pingServer, 350);
      }

      // Premier ping immédiat
      pingServer();
    })();
  </script>
</body>
</html>
