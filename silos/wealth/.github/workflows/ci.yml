name: CI - Silo Patrimoine

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test Silo Patrimoine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout des sources
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configuration de Maven settings.xml (lecture du BOM MyFamilyBudget + publication du silo)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>mfb-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.MFB_PACKAGES_READ_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build et Tests du Silo
        run: mvn --batch-mode clean verify

  publish:
    name: Publication GitHub Packages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout des sources
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configuration de Maven settings.xml (lecture du BOM MyFamilyBudget + publication du silo)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>mfb-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.MFB_PACKAGES_READ_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Déploiement des artefacts sur GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
