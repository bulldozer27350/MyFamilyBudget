name: CI

# Integration continue des branches de travail : compile et lance tous les tests
# (backend Java, smoke test JS, e2e Playwright) a chaque push sur une branche
# AUTRE que main. Aucune publication d'image Docker ici : le deploiement reste
# dans ci-cd.yml, qui ne se declenche que sur main.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & tests (backend + JS + e2e)
    runs-on: ubuntu-latest
    # PostgreSQL pour la variante PostgreSQL de RestartPersistenceTest (VT-320).
    # Les autres tests backend restent sur H2.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myfamilybudget
          POSTGRES_USER: myfamilybudget
          POSTGRES_PASSWORD: myfamilybudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfamilybudget -d myfamilybudget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet requis pour calculer le merge-base avec origin/main ci-dessous
          # (CI selective par sous-graphe, R-93).
          fetch-depth: 0

      - name: Determiner le sous-graphe de modules backend impacte (CI selective, R-93)
        id: subgraph
        run: |
          git fetch origin main --quiet || true
          if base_sha="$(git merge-base origin/main HEAD 2>/dev/null)"; then
            git diff --name-only "$base_sha" HEAD | node tests/gate/select-modules.js >> "$GITHUB_OUTPUT"
          else
            echo "Pas de base commune avec origin/main : repli sur la suite complete." >&2
            { echo "full=true"; echo "modules="; echo "any=true"; } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          # Glob : plus besoin de lister chaque module Maven a la main.
          cache-dependency-path: back/**/pom.xml

      # setup-java enregistre un problem matcher ("java") qui scrute TOUTE la sortie du job a la
      # recherche d'un motif compilateur javac (fichier:ligne: error:), pas seulement celle de
      # mvn compile. La generation du contrat (npm/redocly puis openapi-generator, module api)
      # produit des chemins de fichiers dans ses logs qui peuvent matcher ce motif par coincidence,
      # creant une annotation GitHub trompeuse ; en cas d'echec reel ailleurs, GitHub pointe en
      # priorite vers cette fausse annotation plutot que vers l'erreur reelle. On le retire : les
      # echecs restent visibles (sortie [ERROR] de Maven, step en echec), seules les annotations
      # au mauvais endroit disparaissent.
      - name: Desactiver le problem matcher Java (annotations trompeuses sur la generation du contrat)
        run: echo "::remove-matcher owner=java::"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Backend unit tests (mvn test) - suite complete
        if: steps.subgraph.outputs.full == 'true'
        env:
          MFB_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/myfamilybudget
          MFB_TEST_POSTGRES_USER: myfamilybudget
          MFB_TEST_POSTGRES_PASSWORD: myfamilybudget
        run: mvn -f back/pom.xml -B -pl server -am test

      # R-93 : seuls les modules dont du code a change (et les dependances/dependants que Maven resout
      # lui-meme via -am/-amd, serveur/bootstrap compris des que l'un d'eux en depend meme en portee
      # test) sont construits et testes. Repli sur la variante complete ci-dessus des qu'un fichier
      # touche le build/la CI elle-meme ou un chemin sous back/ hors de tout module connu (voir
      # tests/gate/select-modules.js).
      - name: Backend unit tests (mvn test) - sous-graphe selectif
        if: steps.subgraph.outputs.full != 'true' && steps.subgraph.outputs.any == 'true'
        env:
          MFB_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/myfamilybudget
          MFB_TEST_POSTGRES_USER: myfamilybudget
          MFB_TEST_POSTGRES_PASSWORD: myfamilybudget
        run: mvn -f back/pom.xml -B -pl ${{ steps.subgraph.outputs.modules }} -amd -am test

      - name: Gate VT-600 (controles statiques)
        run: node tests/gate/check-gate.js static

      # Les rapports Surefire n'existent que si une des deux etapes mvn test ci-dessus a tourne.
      - name: Gate VT-600 (rapports de tests, aucun test ignore ou desactive)
        if: steps.subgraph.outputs.any == 'true'
        env:
          MFB_GATE_MODULES: ${{ steps.subgraph.outputs.full == 'true' && '' || steps.subgraph.outputs.modules }}
        run: node tests/gate/check-gate.js reports

      - name: JS smoke test (test-all-apis.js)
        run: bun run test

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: bun run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 7
