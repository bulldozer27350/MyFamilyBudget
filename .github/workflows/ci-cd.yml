name: CI/CD

# Phase 1 du pipeline de deploiement continu :
#   1) build-and-test  : compile le backend, lance les tests unitaires Java,
#                         le smoke test JS et la suite e2e Playwright.
#   2) build-and-push   : uniquement si build-and-test est vert, construit
#                         l'image Docker et la publie sur Docker Hub
#                         (moetourneau/myfamilybudget:latest + :sha-xxxxxxx).
#
# La recuperation de la nouvelle image sur le mini-PC (Watchtower) est geree
# separement, cote serveur : ce workflow n'a pas besoin d'atteindre le
# mini-PC ni le tailnet.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & tests (backend + JS + e2e)
    runs-on: ubuntu-latest
    # PostgreSQL pour la variante PostgreSQL de RestartPersistenceTest (VT-320).
    # Les autres tests backend restent sur H2.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myfamilybudget
          POSTGRES_USER: myfamilybudget
          POSTGRES_PASSWORD: myfamilybudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfamilybudget -d myfamilybudget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            back/pom.xml
            back/retirement-api/pom.xml
            back/retirement-core/pom.xml
            back/tax-api/pom.xml
            back/tax-core/pom.xml
            back/wealth-api/pom.xml
            back/wealth-core/pom.xml
            back/bank-pointage-api/pom.xml
            back/bank-pointage-core/pom.xml
            back/treasury-api/pom.xml
            back/treasury-core/pom.xml
            back/analysis-api/pom.xml
            back/analysis-core/pom.xml
            back/credit-api/pom.xml
            back/credit-core/pom.xml
            back/goals-api/pom.xml
            back/notifications-api/pom.xml
            back/notifications-core/pom.xml
            back/market-api/pom.xml
            back/market-core/pom.xml
            back/api/pom.xml
            back/transition-snapshot/pom.xml
            back/application/pom.xml
            back/persistence/pom.xml
            back/server/pom.xml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Backend unit tests (mvn test)
        env:
          MFB_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/myfamilybudget
          MFB_TEST_POSTGRES_USER: myfamilybudget
          MFB_TEST_POSTGRES_PASSWORD: myfamilybudget
        run: mvn -f back/pom.xml -B -pl server -am test

      # VT-600 : aucun test obligatoire ne doit etre ignore ou desactive (la variante PostgreSQL
      # de RestartPersistenceTest doit s'etre executee, le service postgres ci-dessus etant present).
      - name: Gate VT-600 (aucun test ignore ou desactive)
        run: node tests/gate/check-gate.js all

      - name: JS smoke test (test-all-apis.js)
        run: bun run test

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: bun run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 7

  build-and-push:
    name: Build & push image Docker
    needs: build-and-test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate build-info.json
        run: |
          mkdir -p view/assets
          cat > view/assets/build-info.json <<EOF
          {
            "version": "sha-${{ steps.vars.outputs.sha_short }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat view/assets/build-info.json

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            moetourneau/myfamilybudget:latest
            moetourneau/myfamilybudget:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
