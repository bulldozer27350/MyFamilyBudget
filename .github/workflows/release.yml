name: Release

# Declenche uniquement par la pose d'un tag vX.Y.Z sur l'application.
# Ne remplace pas ci-cd.yml (qui continue de gerer le build/test/Docker
# sur push main) : ce workflow fige la tracabilite d'une livraison.
#
# Deux garde-fous avant tout figeage :
#   1) back/pom.xml (version de l'application) n'est pas en SNAPSHOT et
#      correspond exactement au tag pose.
#   2) Aucune des 11 properties satellites du BOM (back/pom.xml) ne
#      reference un SNAPSHOT.
#
# Si les deux passent, resolution du SHA de tag Git de chacun des 11
# satellites via l'API GitHub, puis generation d'un manifeste de
# tracabilite (release-manifest.yaml) attache a la GitHub Release.
#
# Lot 3 : une fois le figeage ci-dessus passe, le job build-portable-zip
# construit le jar executable (assembly deja en place, back/bootstrap),
# lui embarque une JRE Temurin 21 Windows x64 telechargee depuis l'API
# Adoptium (pas de dependance a un acteur tiers non officiel), et ajoute
# le zip resultant (MyFamilyBudget-X.Y.Z-windows-x64.zip) a la meme
# GitHub Release. Portee assumee : seule la variante Windows x64 est
# produite ici (public cible de l'application) ; MyFamilyBudget.sh reste
# present dans le zip (capable de trouver une JRE systeme sur
# Linux/macOS) mais aucune JRE embarquee n'est encore fournie pour ces
# plateformes - a reprendre dans un patch dedie si besoin.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  freeze-and-release:
    name: Garde-fou BOM + figeage de tracabilite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout des sources
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: back/pom.xml

      - name: Garde-fou 1 - version de l'application stable et coherente avec le tag
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -f back/pom.xml -N -q -Dexpression=project.version -DforceStdout help:evaluate)"
          echo "Version du tag            : $TAG_VERSION"
          echo "Version de back/pom.xml   : $POM_VERSION"
          if [[ "$POM_VERSION" == *-SNAPSHOT ]]; then
            echo "::error::back/pom.xml est encore en SNAPSHOT ($POM_VERSION). Impossible de figer une release depuis une version non stable." >&2
            exit 1
          fi
          if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Le tag ($TAG_VERSION) ne correspond pas a la version de back/pom.xml ($POM_VERSION)." >&2
            exit 1
          fi

      - name: Garde-fou 2 - aucun satellite du BOM ne doit etre en SNAPSHOT
        run: |
          set -euo pipefail
          declare -A SATELLITES=(
            [credit]=myfamilybudget-domain-credit
            [retirement]=myfamilybudget-domain-retirement
            [tax]=myfamilybudget-domain-tax
            [wealth]=myfamilybudget-domain-wealth
            [bank-pointage]=myfamilybudget-domain-bank-pointage
            [treasury]=myfamilybudget-domain-treasury
            [analysis]=myfamilybudget-domain-analysis
            [goals]=myfamilybudget-domain-goals
            [settings]=myfamilybudget-domain-settings
            [notifications]=myfamilybudget-domain-notifications
            [market]=myfamilybudget-domain-market
          )
          FAIL=0
          echo "name,version,repo" > "$RUNNER_TEMP/satellites.csv"
          for name in "${!SATELLITES[@]}"; do
            repo="${SATELLITES[$name]}"
            version="$(mvn -f back/pom.xml -N -q -Dexpression=${name}.version -DforceStdout help:evaluate)"
            echo "${name}.version -> ${version}"
            if [[ "$version" == *-SNAPSHOT ]]; then
              echo "::error::La property ${name}.version reference encore un SNAPSHOT (${version}). Impossible de figer la release." >&2
              FAIL=1
            fi
            echo "${name},${version},${repo}" >> "$RUNNER_TEMP/satellites.csv"
          done
          if [[ "$FAIL" == "1" ]]; then
            exit 1
          fi

      - name: Resolution des SHA de tag de chaque satellite (tracabilite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "name,version,repo,sha,tag_url" > "$RUNNER_TEMP/satellites-resolved.csv"
          while IFS=, read -r name version repo; do
            tag="v${version}"
            api_url="https://api.github.com/repos/bulldozer27350/${repo}/git/ref/tags/${tag}"
            response="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api_url")" || {
              echo "::error::Impossible de joindre l'API GitHub pour le tag ${tag} sur bulldozer27350/${repo} (satellite ${name})." >&2
              exit 1
            }
            sha="$(python3 -c "import sys,json; print(json.loads(sys.argv[1]).get('object',{}).get('sha',''))" "$response")"
            if [[ -z "$sha" ]]; then
              echo "::error::Le tag ${tag} est introuvable sur bulldozer27350/${repo} (satellite ${name}). A-t-il bien ete release ?" >&2
              exit 1
            fi
            tag_url="https://github.com/bulldozer27350/${repo}/releases/tag/${tag}"
            echo "${name},${version},${repo},${sha},${tag_url}" >> "$RUNNER_TEMP/satellites-resolved.csv"
          done < <(tail -n +2 "$RUNNER_TEMP/satellites.csv")
          cat "$RUNNER_TEMP/satellites-resolved.csv"

      - name: Generation du manifeste de tracabilite (release-manifest.yaml)
        run: |
          set -euo pipefail
          python3 - "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/satellites-resolved.csv" "$RUNNER_TEMP/release-manifest.yaml" <<'PY'
          import csv
          import datetime
          import sys

          tag, app_sha, csv_path, out_path = sys.argv[1:5]
          app_version = tag[1:] if tag.startswith("v") else tag

          with open(csv_path, newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          generated_at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          with open(out_path, "w", encoding="utf-8", newline="\n") as f:
              f.write("# Manifeste de tracabilite - genere automatiquement par .github/workflows/release.yml\n")
              f.write("# Ne pas modifier a la main : une livraison est immuable une fois publiee.\n")
              f.write("application:\n")
              f.write("  repository: bulldozer27350/MyFamilyBudget\n")
              f.write(f"  version: \"{app_version}\"\n")
              f.write(f"  tag: \"{tag}\"\n")
              f.write(f"  sha: \"{app_sha}\"\n")
              f.write(f"  generated_at: \"{generated_at}\"\n")
              f.write("satellites:\n")
              for row in rows:
                  f.write(f"  - name: \"{row['name']}\"\n")
                  f.write(f"    repository: \"bulldozer27350/{row['repo']}\"\n")
                  f.write(f"    version: \"{row['version']}\"\n")
                  f.write(f"    tag: \"v{row['version']}\"\n")
                  f.write(f"    sha: \"{row['sha']}\"\n")
                  f.write(f"    tag_url: \"{row['tag_url']}\"\n")
          PY
          cat "$RUNNER_TEMP/release-manifest.yaml"

      - name: Creation de la GitHub Release (manifeste de tracabilite attache)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release-manifest.yaml

  build-portable-zip:
    name: Zip portable Windows x64 (JRE embarquee) + ajout a la Release
    needs: freeze-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout des sources
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: back/pom.xml

      # Memes tokens de lecture que ci-cd.yml : le reactor (bootstrap -am) a besoin
      # de resoudre les *-api/*-core des 11 silos extraits depuis GitHub Packages.
      - name: Configuration de Maven settings.xml (lecture des *-api/*-core des silos extraits)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>domain-credit-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_CREDIT_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-retirement-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_RETIREMENT_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-tax-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_TAX_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-wealth-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_WEALTH_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-bank-pointage-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_BANK_POINTAGE_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-treasury-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_TREASURY_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-analysis-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_ANALYSIS_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-goals-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_GOALS_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-settings-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_SETTINGS_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-notifications-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_NOTIFICATIONS_PACKAGES_READ_TOKEN }}</password>
              </server>
              <server>
                <id>domain-market-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.DOMAIN_MARKET_PACKAGES_READ_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Tests deja executes par ci-cd.yml sur le commit de main que ce tag designe
      # (garde-fou 1 de freeze-and-release l'exige implicitement : la version de
      # back/pom.xml n'est bumpee/taggee qu'une fois l'integration validee). On ne
      # rejoue donc pas ici la suite complete (Postgres + Playwright) : seul le
      # packaging (jar executable + zip portable sans JRE, assembly deja en place
      # dans back/bootstrap) est necessaire.
      - name: Construction du jar executable et du zip portable (sans JRE)
        run: mvn -f back/pom.xml -B -pl bootstrap -am package -DskipTests

      - name: Preparation du dossier de distribution
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dist"
          unzip -q "back/bootstrap/target/MyFamilyBudget-${VERSION}.zip" -d "$RUNNER_TEMP/dist"

      # API Adoptium (projet officiel Eclipse Temurin) : URL stable, pas d'authentification
      # necessaire. image_type=jre (pas jdk) pour limiter la taille embarquee au strict
      # necessaire a l'execution. Voir MyFamilyBudget.bat / MyFamilyBudget.sh : les deux
      # lanceurs cherchent deja une JRE embarquee dans /jre en priorite.
      - name: Telechargement de la JRE Temurin 21 (Windows x64)
        run: |
          set -euo pipefail
          API_URL="https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          curl -sSfL -o "$RUNNER_TEMP/temurin-jre-windows-x64.zip" "$API_URL"
          mkdir -p "$RUNNER_TEMP/jre-windows-x64"
          unzip -q "$RUNNER_TEMP/temurin-jre-windows-x64.zip" -d "$RUNNER_TEMP/jre-windows-x64"
          # L'archive Adoptium contient un seul dossier racine (ex. jdk-21.x.y+z-jre) :
          # on en reprend le contenu directement sous MyFamilyBudget/jre.
          JRE_ROOT="$(find "$RUNNER_TEMP/jre-windows-x64" -mindepth 1 -maxdepth 1 -type d)"
          mkdir -p "$RUNNER_TEMP/dist/MyFamilyBudget/jre"
          cp -r "$JRE_ROOT"/. "$RUNNER_TEMP/dist/MyFamilyBudget/jre/"

      - name: Reconstruction du zip portable Windows x64 avec JRE embarquee
        run: |
          set -euo pipefail
          ZIP_NAME="MyFamilyBudget-${VERSION}-windows-x64.zip"
          ( cd "$RUNNER_TEMP/dist" && zip -qr -X "$RUNNER_TEMP/${ZIP_NAME}" MyFamilyBudget )
          echo "PORTABLE_ZIP_PATH=$RUNNER_TEMP/${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Ajout du zip portable a la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PORTABLE_ZIP_PATH }}
          generate_release_notes: true
