services:
  db:
    image: postgres:16-alpine
    container_name: myfamilybudget-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myfamilybudget}
      POSTGRES_USER: ${POSTGRES_USER:-myfamilybudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myfamilybudget}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myfamilybudget} -d ${POSTGRES_DB:-myfamilybudget}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myfamilybudget-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-myfamilybudget}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myfamilybudget}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-myfamilybudget}
      # Cle d'API Webstat (Banque de France) pour le taux de marche des credits. Le .env sert
      # uniquement a la substitution de variables dans ce fichier : sans cette ligne, la variable
      # n'atteint jamais le conteneur. Vide (defaut) => source ignoree, taux a saisir a la main.
      MYFAMILYBUDGET_BDF_API_KEY: ${MYFAMILYBUDGET_BDF_API_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
