# Domaine Retraite (RF-C00, voir doc/architecture/03-domaine-retraite.md).
# Inclus depuis openapi.yaml via $ref par chemin (un fichier par domaine,
# voir doc/architecture/01-sequencement.md, etape 13).
paths:
  /retraite:
    get:
      summary: Recupere la simulation et la configuration retraite
      operationId: getRetraite
      tags:
        - Retraite
      responses:
        '200':
          description: Configuration et resultats de retraite
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Sauvegarde la configuration retraite
      operationId: saveRetraite
      tags:
        - Retraite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Configuration enregistree
