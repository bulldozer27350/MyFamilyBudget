# Domaine Overview (RF-C00, voir doc/architecture/11-domaine-overview.md).
# Inclus depuis openapi.yaml via $ref par chemin (un fichier par domaine,
# voir doc/architecture/01-sequencement.md, etape 13).
#
# BudgetDataDto, CashflowYearDto et PatrimoineProjectionsDto restent dans
# openapi.yaml : partages avec /budget, /tresorerie et /patrimoine.
paths:
  /overview:
    get:
      summary: Recupere la vue d'ensemble (KPIs, projections, jauges FIRE)
      operationId: getOverview
      tags:
        - Overview
      parameters:
        - name: useConstantEuros
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Donnees synthetiques de la vue d'ensemble
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponseDto'

components:
  schemas:
    OverviewResponseDto:
      type: object
      properties:
        data:
          $ref: '../../openapi.yaml#/components/schemas/BudgetDataDto'
        years:
          type: array
          items:
            type: integer
        cashflow:
          type: array
          items:
            $ref: '../../openapi.yaml#/components/schemas/CashflowYearDto'
        patrimoine:
          $ref: '../../openapi.yaml#/components/schemas/PatrimoineProjectionsDto'
        useConstantEuros:
          type: boolean
        retireYear:
          type: integer
        pivotBalance:
          type: number
        patrimoineActuel:
          type: number
        fluxNetActuel:
          type: number
        retireCharges:
          type: number
        totalPensions:
          type: number
        retirePatrimoine:
          $ref: '#/components/schemas/TripleAmountDto'
        fireRente:
          $ref: '#/components/schemas/TripleAmountDto'
        financialOnlyRente:
          $ref: '#/components/schemas/TripleAmountDto'

    TripleAmountDto:
      type: object
      properties:
        pess:
          type: number
        corr:
          type: number
        opti:
          type: number
